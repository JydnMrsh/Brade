<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiftLog">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>LiftLog</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#1f232c; --line:#2a2f3a;
    --text:#eef0f4; --muted:#8b93a3; --accent:#ff7a3d; --accent2:#ffb38f; --danger:#ff5c5c; --ok:#4cd187;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{display:flex;align-items:center;gap:10px;padding:14px 18px 6px}
  header h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.5px;flex:1}
  .iconbtn{background:none;border:0;color:var(--accent);font-size:16px;font-weight:600;padding:8px 4px;cursor:pointer}
  main{padding:8px 16px 40px;max-width:560px;margin:0 auto}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .row{display:flex;gap:10px;align-items:center}
  .ex{display:flex;align-items:center;gap:12px;cursor:pointer}
  .ex .name{font-weight:700;font-size:18px}
  .ex .meta{font-size:13px;color:var(--muted)}
  .ex .chev{margin-left:auto;color:var(--muted);font-size:22px}
  button.primary{width:100%;background:var(--accent);color:#1a0c04;border:0;border-radius:12px;
    padding:14px;font-size:17px;font-weight:700;cursor:pointer}
  button.primary:active{opacity:.85}
  button.ghost{background:var(--card2);color:var(--text);border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;cursor:pointer}
  input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;
    padding:12px;font-size:18px;outline:none;font-family:inherit}
  input:focus{border-color:var(--accent)}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  .sets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .sets input{text-align:center;font-size:24px;font-weight:700;padding:14px 4px}
  .tabs{display:flex;background:var(--card);border-radius:12px;padding:4px;margin-bottom:12px}
  .tabs button{flex:1;background:none;border:0;color:var(--muted);padding:10px;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer}
  .tabs button.on{background:var(--card2);color:var(--text)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .stat{background:var(--card);border-radius:14px;padding:14px}
  .stat .v{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .hist{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
  .hist:first-child{border-top:0}
  .hist .d{font-weight:600}
  .chip{background:var(--card2);border-radius:8px;padding:4px 9px;font-weight:700;font-variant-numeric:tabular-nums}
  .del{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:6px}
  .empty{text-align:center;padding:30px 10px;color:var(--muted)}
  canvas{width:100%;height:200px;display:block}
  .seg{display:flex;gap:6px;margin-bottom:8px}
  .seg button{background:var(--card2);color:var(--muted);border:0;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}
  .seg button.on{color:#1a0c04;background:var(--accent2)}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--ok);color:#04150b;padding:10px 18px;border-radius:20px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .modal.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet h2{margin:0 0 14px;font-size:20px}
  textarea{width:100%;height:140px;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px;font-size:12px;font-family:ui-monospace,monospace}
  .pr{color:var(--accent);font-size:12px;font-weight:700}
  .section{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 4px 8px}
  .handle{margin-left:auto;color:var(--muted);font-size:24px;padding:6px 4px 6px 14px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  .dragging{position:relative;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.5);background:var(--card2);transition:none}
  .done{color:var(--ok);font-size:12px;font-weight:700;margin-left:4px}
  .pick{max-height:45vh;overflow:auto}
  .pickrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);color:var(--text);font-size:17px;margin:0}
  .pickrow:first-child{border-top:0}
  .pickrow input{width:22px;height:22px;accent-color:var(--accent);flex:none}
  .wtop{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}
  .dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--line);cursor:pointer}
  .dot.ok{background:var(--ok)}
  .dot.cur{outline:2px solid var(--accent);outline-offset:2px}
  .wname{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
  .logged{background:rgba(76,209,135,.12);color:var(--ok);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;margin-bottom:12px}
  button:disabled{opacity:.35}
</style>
</head>
<body>
<header>
  <button class="iconbtn" id="backBtn" style="display:none">‹ Back</button>
  <h1 id="title">LiftLog</h1>
  <button class="iconbtn" id="menuBtn">•••</button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
// ---------- storage ----------
const KEY = 'liftlog-v1';
let db = { unit:'kg', exercises:[], sessions:[] };
function load(){ try{ const s = localStorage.getItem(KEY); if(s) db = Object.assign(db, JSON.parse(s)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('Could not save', true); } }
load();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

// ---------- maths ----------
// Epley estimated one-rep max for a single set
const e1rm = (w, r) => r <= 0 || !w ? 0 : (r === 1 ? w : w * (1 + r/30));
const sessionBest1rm = s => Math.max(0, ...s.reps.map(r => e1rm(s.weight, r)));
const sessionVolume = s => s.reps.reduce((a,b)=>a+b,0) * (s.weight || 0);
const fmt = n => (Math.round(n*10)/10).toString();
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const prettyDate = iso => new Date(iso+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const sessionsFor = id => db.sessions.filter(s => s.exId === id).sort((a,b)=> a.date===b.date ? a.t-b.t : a.date.localeCompare(b.date));

// ---------- ui helpers ----------
const $ = s => document.querySelector(s);
const app = $('#app');
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, bad){ const t=$('#toast'); t.textContent=msg; t.style.background = bad?'var(--danger)':'var(--ok)'; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600); }
function sheet(html){ $('#sheet').innerHTML = html; $('#modal').classList.add('show'); }
function closeSheet(){ $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e => { if(e.target.id==='modal') closeSheet(); });
function confirmSheet(msg, okText, onOk){
  sheet(`<h2>${esc(msg)}</h2><div class="row"><button class="ghost" style="flex:1" id="cNo">Cancel</button>
    <button class="primary" style="flex:1;background:var(--danger)" id="cYes">${esc(okText)}</button></div>`);
  $('#cNo').onclick = closeSheet; $('#cYes').onclick = () => { closeSheet(); onOk(); };
}

// ---------- routing (a simple stack so Back returns to where you came from) ----------
if(!Array.isArray(db.days)) db.days = [];
let stack = [{ name:'home' }];
let view = stack[0];
function go(v){ stack.push(v); view = v; render(); window.scrollTo(0,0); }
function back(){ if(stack.length>1) stack.pop(); view = stack[stack.length-1]; render(); window.scrollTo(0,0); }
function goHome(){ stack = [{name:'home'}]; view = stack[0]; render(); }
$('#backBtn').onclick = back;
$('#menuBtn').onclick = openMenu;

function render(){
  $('#backBtn').style.display = stack.length>1 ? '' : 'none';
  if(view.name==='home') return renderHome();
  if(view.name==='day') return renderDay();
  if(view.name==='library') return renderLibrary();
  if(view.name==='exercise') return renderExercise();
  if(view.name==='workout') return renderWorkout();
}

// ---------- drag to reorder (touch + mouse, via a ≡ handle) ----------
function sortable(list, onDone){
  list.querySelectorAll('.handle').forEach(h => {
    h.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      const item = h.closest('[data-id]');
      const gap = parseFloat(getComputedStyle(item).marginBottom) || 0;
      let lastY = e.clientY, offset = 0;
      item.classList.add('dragging');
      const move = ev => {
        offset += ev.clientY - lastY; lastY = ev.clientY;
        const next = item.nextElementSibling, prev = item.previousElementSibling;
        if(next && next.dataset.id && offset > next.offsetHeight/2){
          const d = next.offsetHeight + gap; list.insertBefore(next, item); offset -= d;
        } else if(prev && prev.dataset.id && offset < -prev.offsetHeight/2){
          const d = prev.offsetHeight + gap; list.insertBefore(item, prev); offset += d;
        }
        item.style.transform = `translateY(${offset}px)`;
      };
      const up = () => {
        item.style.transform = ''; item.classList.remove('dragging');
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
        onDone([...list.children].filter(x => x.dataset.id).map(x => x.dataset.id));
      };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    });
  });
}

const lastSession = exId => { const ss = sessionsFor(exId); return ss[ss.length-1]; };
const exMeta = ex => { const l = lastSession(ex.id);
  return l ? `Last: ${prettyDate(l.date)} · ${fmt(l.weight)}${db.unit} × ${l.reps.join('/')}` : 'No sets logged yet'; };
const exCard = (ex, withHandle) => {
  const doneToday = db.sessions.some(s => s.exId===ex.id && s.date===today());
  return `<div class="card ex" data-id="${ex.id}">
    <div style="min-width:0;flex:1"><div class="name">${esc(ex.name)} ${doneToday?'<span class="done">✓ Today</span>':''}</div><div class="meta">${exMeta(ex)}</div></div>
    ${withHandle? '<div class="handle" aria-label="Drag to reorder">≡</div>' : '<div class="chev">›</div>'}</div>`;
};

// ---------- home: days ----------
function renderHome(){
  $('#title').textContent = 'LiftLog';
  const days = db.days.map(d => {
    const dates = db.sessions.filter(s => d.exIds.includes(s.exId)).map(s => s.date).sort();
    const last = dates[dates.length-1];
    return `<div class="card ex day" data-id="${d.id}">
      <div style="min-width:0;flex:1"><div class="name">${esc(d.name)}</div>
      <div class="meta">${d.exIds.length} exercise${d.exIds.length===1?'':'s'}${last? ' · last done '+prettyDate(last):''}</div></div>
      <div class="handle" aria-label="Drag to reorder">≡</div></div>`;
  }).join('');
  app.innerHTML = `
    <div class="section">Workout days</div>
    <div id="dayList">${days || `<div class="card empty">Create a day like <b>Push</b>, <b>Pull</b> or <b>Legs</b>,<br>then add exercises to it.</div>`}</div>
    <div class="card">
      <label for="newDay">New day</label>
      <div class="row"><input id="newDay" placeholder="e.g. Pull day" autocomplete="off">
      <button class="ghost" id="addDay" style="white-space:nowrap">Add</button></div>
    </div>
    <div class="section">Library</div>
    <div class="card ex" id="libBtn"><div style="flex:1"><div class="name">All exercises</div>
      <div class="meta">${db.exercises.length} exercise${db.exercises.length===1?'':'s'}</div></div><div class="chev">›</div></div>`;
  app.querySelectorAll('.day').forEach(el => el.onclick = e => { if(!e.target.closest('.handle')) go({name:'day', id:el.dataset.id}); });
  sortable($('#dayList'), ids => { db.days.sort((a,b) => ids.indexOf(a.id)-ids.indexOf(b.id)); save(); });
  const add = () => {
    const n = $('#newDay').value.trim(); if(!n) return;
    const d = {id:uid(), name:n, exIds:[]}; db.days.push(d); save();
    go({name:'day', id:d.id}); openAddToDay(d);
  };
  $('#addDay').onclick = add;
  $('#newDay').onkeydown = e => { if(e.key==='Enter') add(); };
  $('#libBtn').onclick = () => go({name:'library'});
}

// ---------- a single day ----------
function renderDay(){
  const d = db.days.find(x => x.id===view.id);
  if(!d) return goHome();
  $('#title').textContent = d.name;
  d.exIds = d.exIds.filter(id => db.exercises.some(e => e.id===id));
  const exs = d.exIds.map(id => db.exercises.find(e => e.id===id));
  const doneCount = exs.filter(ex => db.sessions.some(s => s.exId===ex.id && s.date===today())).length;
  app.innerHTML = `
    ${exs.length ? `<div class="muted small" style="margin:0 4px 10px">${doneCount}/${exs.length} done today · drag ≡ to reorder</div>` : ''}
    <div id="exList">${exs.map(ex => exCard(ex, true)).join('') || `<div class="card empty">No exercises in this day yet.</div>`}</div>
    ${exs.length ? `<button class="primary" id="startW" style="margin-bottom:10px">▶ Start workout</button>` : ''}
    <button class="${exs.length?'ghost':'primary'}" id="addToDay" style="width:100%">+ Add / remove exercises</button>
    <div class="row" style="margin-top:12px">
      <button class="ghost" style="flex:1" id="renDay">Rename day</button>
      <button class="ghost" style="flex:1;color:var(--danger)" id="delDay">Delete day</button>
    </div>`;
  app.querySelectorAll('#exList .ex').forEach(el => el.onclick = e => { if(!e.target.closest('.handle')) go({name:'exercise', id:el.dataset.id, tab:'log'}); });
  sortable($('#exList'), ids => { d.exIds = ids; save(); });
  $('#addToDay').onclick = () => openAddToDay(d);
  if(exs.length) $('#startW').onclick = () => {
    // start at the first exercise not yet logged today
    const first = d.exIds.findIndex(id => !db.sessions.some(s => s.exId===id && s.date===today()));
    go({name:'workout', dayId:d.id, idx: first<0 ? 0 : first, started: Date.now(), log:[] });
  };
  $('#renDay').onclick = () => {
    sheet(`<h2>Rename day</h2><input id="rn" value="${esc(d.name)}" autocomplete="off">
      <button class="primary" style="margin-top:12px" id="rnOk">Save</button>`);
    const ok = () => { const n=$('#rn').value.trim(); if(n){ d.name=n; save(); } closeSheet(); render(); };
    $('#rnOk').onclick = ok; $('#rn').onkeydown = e => { if(e.key==='Enter') ok(); };
  };
  $('#delDay').onclick = () => confirmSheet(`Delete "${d.name}"? Your exercises and history are kept.`, 'Delete', () => {
    db.days = db.days.filter(x => x.id!==d.id); save(); goHome();
  });
}

// pick which exercises belong to a day (tick to add, untick to remove, or create new)
function openAddToDay(d){
  const picked = new Set(d.exIds);
  const draw = () => {
    sheet(`<h2>Exercises in ${esc(d.name)}</h2>
      <div class="pick">${db.exercises.map(ex => `
        <label class="pickrow"><input type="checkbox" data-id="${ex.id}" ${picked.has(ex.id)?'checked':''}><span>${esc(ex.name)}</span></label>`).join('')
        || '<div class="muted small" style="padding:8px 0">No exercises yet. Create one below.</div>'}</div>
      <div class="row" style="margin-top:10px"><input id="nx" placeholder="New exercise name" autocomplete="off">
        <button class="ghost" id="nxAdd" style="white-space:nowrap">Create</button></div>
      <button class="primary" style="margin-top:12px" id="pkDone">Done</button>`);
    document.querySelectorAll('.pick input').forEach(cb => cb.onchange = () => cb.checked ? picked.add(cb.dataset.id) : picked.delete(cb.dataset.id));
    const create = () => {
      const n = $('#nx').value.trim(); if(!n) return;
      let ex = db.exercises.find(e => e.name.toLowerCase()===n.toLowerCase());
      if(!ex){ ex = {id:uid(), name:n}; db.exercises.push(ex); save(); }
      picked.add(ex.id); draw(); setTimeout(()=>$('#nx').focus(), 50);
    };
    $('#nxAdd').onclick = create; $('#nx').onkeydown = e => { if(e.key==='Enter') create(); };
    $('#pkDone').onclick = () => {
      d.exIds = d.exIds.filter(id => picked.has(id)).concat([...picked].filter(id => !d.exIds.includes(id)));
      save(); closeSheet(); render();
    };
  };
  draw();
}

// ---------- workout mode: step through a day's exercises ----------
function renderWorkout(){
  const d = db.days.find(x => x.id===view.dayId);
  if(!d || !d.exIds.length) return back();
  if(view.finished) return renderSummary(d);
  const n = d.exIds.length;
  view.idx = Math.max(0, Math.min(view.idx, n-1));
  const ex = db.exercises.find(e => e.id===d.exIds[view.idx]);
  if(!ex){ d.exIds.splice(view.idx,1); save(); return render(); }
  $('#title').textContent = d.name;
  const ss = sessionsFor(ex.id); const last = ss[ss.length-1];
  const todays = ss.filter(s => s.date===today());
  const doneToday = todays[todays.length-1];
  const best = ss.length ? Math.max(...ss.map(sessionBest1rm)) : 0;
  const isLast = view.idx === n-1;
  const nextEx = !isLast ? db.exercises.find(e => e.id===d.exIds[view.idx+1]) : null;
  const dots = d.exIds.map((id,i) => {
    const done = db.sessions.some(s => s.exId===id && s.date===today());
    return `<span class="dot ${i===view.idx?'cur':''} ${done?'ok':''}" data-i="${i}"></span>`;
  }).join('');
  app.innerHTML = `
    <div class="wtop"><span class="muted small">Exercise ${view.idx+1} of ${n}</span><div class="dots">${dots}</div></div>
    <div class="card">
      <div class="wname">${esc(ex.name)}</div>
      <div class="muted small" style="margin-bottom:14px">
        ${last ? `Last time: <b style="color:var(--text)">${fmt(last.weight)}${db.unit} × ${last.reps.join(' / ')}</b> · ${prettyDate(last.date)}` : 'First time doing this one'}
        ${best ? `<br>Best est. 1RM: ${fmt(best)}${db.unit}` : ''}
      </div>
      ${doneToday ? `<div class="logged">✓ Logged today: ${fmt(doneToday.weight)}${db.unit} × ${doneToday.reps.join(' / ')}</div>` : ''}
      <label>Weight (${db.unit})</label>
      <input type="number" inputmode="decimal" id="weight" placeholder="0" value="${(doneToday||last) ? (doneToday||last).weight : ''}" style="margin-bottom:14px">
      <label>Reps per set</label>
      <div class="sets">
        ${[0,1,2].map(i=>`<div><input type="number" inputmode="numeric" class="rep" placeholder="${last? last.reps[i] : '–'}"><div class="muted small" style="text-align:center;margin-top:4px">Set ${i+1}</div></div>`).join('')}
      </div>
      <button class="primary" id="saveNext" style="margin-top:16px">${isLast ? 'Save & finish' : 'Save & next →'}</button>
      ${nextEx ? `<div class="muted small" style="text-align:center;margin-top:8px">Up next: ${esc(nextEx.name)}</div>` : ''}
    </div>
    <div class="row">
      <button class="ghost" style="flex:1" id="prevBtn" ${view.idx===0?'disabled':''}>← Prev</button>
      <button class="ghost" style="flex:1" id="skipBtn">${isLast ? 'Finish' : (doneToday ? 'Next →' : 'Skip →')}</button>
    </div>
    <button class="ghost" style="width:100%;margin-top:10px;color:var(--muted)" id="endBtn">End workout</button>`;
  const reps = [...document.querySelectorAll('.rep')];
  reps.forEach((r,i) => r.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); (reps[i+1]||$('#saveNext')).focus(); }});
  const advance = () => { if(isLast){ view.finished = true; } else view.idx++; render(); window.scrollTo(0,0); };
  document.querySelectorAll('.dot').forEach(dt => dt.onclick = () => { view.idx = +dt.dataset.i; render(); });
  $('#saveNext').onclick = () => {
    const r = reps.map(x => parseInt(x.value,10));
    if(r.every(isNaN) && doneToday) return advance();          // already logged, nothing new typed
    if(r.some(x => isNaN(x) || x < 0)) return toast('Enter reps for all 3 sets', true);
    const w = parseFloat($('#weight').value) || 0;
    const s = {id:uid(), exId:ex.id, date:today(), weight:w, reps:r, t:Date.now()};
    db.sessions.push(s); save();
    const nb = sessionBest1rm(s);
    const pr = ss.length && nb > best;
    view.log.push({exId:ex.id, pr});
    toast(pr ? `New best! Est. 1RM ${fmt(nb)}${db.unit}` : 'Saved');
    advance();
  };
  $('#prevBtn').onclick = () => { view.idx--; render(); };
  $('#skipBtn').onclick = advance;
  $('#endBtn').onclick = () => { view.finished = true; render(); };
}

function renderSummary(d){
  $('#title').textContent = 'Workout done';
  const mins = Math.max(1, Math.round((Date.now()-view.started)/60000));
  const rows = d.exIds.map(id => {
    const ex = db.exercises.find(e => e.id===id); if(!ex) return '';
    const t = db.sessions.filter(s => s.exId===id && s.date===today());
    const s = t[t.length-1];
    const pr = view.log.some(l => l.exId===id && l.pr);
    return `<div class="hist"><div style="min-width:0"><div class="d">${esc(ex.name)} ${pr?'<span class="pr">PR</span>':''}</div>
      <div class="small muted">${s ? fmt(s.weight)+db.unit : 'Skipped'}</div></div>
      <div class="row" style="gap:6px;margin-left:auto">${s ? s.reps.map(r=>`<span class="chip">${r}</span>`).join('') : '<span class="muted">—</span>'}</div></div>`;
  }).join('');
  const doneN = d.exIds.filter(id => db.sessions.some(s => s.exId===id && s.date===today())).length;
  const prs = view.log.filter(l => l.pr).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="l">Exercises</div><div class="v">${doneN}/${d.exIds.length}</div></div>
      <div class="stat"><div class="l">${prs ? 'New PRs' : 'Time'}</div><div class="v">${prs ? prs : mins+'<span class="small muted"> min</span>'}</div></div>
    </div>
    <div class="card"><b>${esc(d.name)} · ${prettyDate(today())}</b><div style="margin-top:6px">${rows}</div></div>
    <button class="primary" id="doneBtn">Done</button>`;
  $('#doneBtn').onclick = back;
}

// ---------- library: every exercise ----------
function renderLibrary(){
  $('#title').textContent = 'All exercises';
  app.innerHTML = `
    ${db.exercises.map(ex => exCard(ex, false)).join('') || `<div class="card empty">No exercises yet.</div>`}
    <div class="card">
      <label for="newEx">New exercise</label>
      <div class="row"><input id="newEx" placeholder="Exercise name" autocomplete="off">
      <button class="ghost" id="addEx" style="white-space:nowrap">Add</button></div>
    </div>`;
  app.querySelectorAll('.ex').forEach(el => el.onclick = () => go({name:'exercise', id:el.dataset.id, tab:'log'}));
  const add = () => {
    const n = $('#newEx').value.trim(); if(!n) return;
    db.exercises.push({id:uid(), name:n}); save(); render(); toast('Added '+n);
  };
  $('#addEx').onclick = add;
  $('#newEx').onkeydown = e => { if(e.key==='Enter') add(); };
}

// ---------- exercise ----------
function renderExercise(){
  const ex = db.exercises.find(e => e.id===view.id);
  if(!ex) return back();
  $('#title').textContent = ex.name;
  const tab = view.tab || 'log';
  app.innerHTML = `
    <div class="tabs">
      <button data-t="log" class="${tab==='log'?'on':''}">Log</button>
      <button data-t="stats" class="${tab==='stats'?'on':''}">Stats</button>
      <button data-t="history" class="${tab==='history'?'on':''}">History</button>
    </div><div id="pane"></div>`;
  app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { view.tab=b.dataset.t; renderExercise(); });
  ({log:renderLog, stats:renderStats, history:renderHistory})[tab](ex);
}

function renderLog(ex){
  const ss = sessionsFor(ex.id); const last = ss[ss.length-1];
  $('#pane').innerHTML = `
    <div class="card">
      <div class="row" style="margin-bottom:14px">
        <div style="flex:1"><label>Date</label><input type="date" id="date" value="${today()}"></div>
        <div style="flex:1"><label>Weight (${db.unit})</label><input type="number" inputmode="decimal" id="weight" placeholder="0" value="${last? last.weight : ''}"></div>
      </div>
      <label>Reps per set</label>
      <div class="sets">
        ${[0,1,2].map(i=>`<div><input type="number" inputmode="numeric" class="rep" placeholder="${last? last.reps[i] : '–'}"><div class="muted small" style="text-align:center;margin-top:4px">Set ${i+1}</div></div>`).join('')}
      </div>
      ${last ? `<div class="muted small" style="margin-top:10px">Last time: ${fmt(last.weight)}${db.unit} × ${last.reps.join(' / ')} (${prettyDate(last.date)})</div>` : ''}
      <button class="primary" id="saveBtn" style="margin-top:16px">Save workout</button>
    </div>`;
  const reps = [...document.querySelectorAll('.rep')];
  reps.forEach((r,i) => r.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); (reps[i+1]||$('#saveBtn')).focus(); }});
  $('#saveBtn').onclick = () => {
    const w = parseFloat($('#weight').value) || 0;
    const r = reps.map(x => parseInt(x.value,10));
    if(r.some(x => isNaN(x) || x < 0)) return toast('Enter reps for all 3 sets', true);
    const prevBest = Math.max(0, ...ss.map(sessionBest1rm));
    const s = {id:uid(), exId:ex.id, date:$('#date').value || today(), weight:w, reps:r, t:Date.now()};
    db.sessions.push(s); save();
    const nb = sessionBest1rm(s);
    toast(ss.length && nb > prevBest ? `New best! Est. 1RM ${fmt(nb)}${db.unit}` : 'Saved');
    view.tab = 'stats'; renderExercise();
  };
}

function renderStats(ex){
  const ss = sessionsFor(ex.id);
  if(!ss.length){ $('#pane').innerHTML = `<div class="card empty">Log a workout to see stats.</div>`; return; }
  const allReps = ss.flatMap(s => s.reps);
  const avgReps = allReps.reduce((a,b)=>a+b,0) / allReps.length;
  const perSet = [0,1,2].map(i => ss.reduce((a,s)=>a+(s.reps[i]||0),0)/ss.length);
  const best = ss.reduce((b,s) => sessionBest1rm(s) > sessionBest1rm(b) ? s : b);
  const latest = ss[ss.length-1];
  const avgW = ss.reduce((a,s)=>a+s.weight,0)/ss.length;
  const u = db.unit;
  const hasWeight = ss.some(s => s.weight > 0);
  $('#pane').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="l">Best est. 1RM</div><div class="v">${hasWeight? fmt(sessionBest1rm(best))+'<span class="small muted"> '+u+'</span>' : '—'}</div><div class="small muted">${hasWeight? prettyDate(best.date):'add weight to calculate'}</div></div>
      <div class="stat"><div class="l">Latest est. 1RM</div><div class="v">${hasWeight? fmt(sessionBest1rm(latest))+'<span class="small muted"> '+u+'</span>' : '—'}</div><div class="small muted">${prettyDate(latest.date)}</div></div>
      <div class="stat"><div class="l">Avg reps / set</div><div class="v">${fmt(avgReps)}</div><div class="small muted">S1 ${fmt(perSet[0])} · S2 ${fmt(perSet[1])} · S3 ${fmt(perSet[2])}</div></div>
      <div class="stat"><div class="l">Avg weight</div><div class="v">${fmt(avgW)}<span class="small muted"> ${u}</span></div><div class="small muted">${ss.length} workout${ss.length>1?'s':''}</div></div>
    </div>
    <div class="card">
      <div class="seg" id="seg">
        <button data-m="1rm">Est. 1RM</button><button data-m="reps">Total reps</button><button data-m="vol">Volume</button><button data-m="w">Weight</button>
      </div>
      <canvas id="chart"></canvas>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:4px"><b>Recent sets</b><button class="iconbtn" id="allHist">See all</button></div>
      ${historyRows(ss.slice(-5).reverse(), ss, false)}
    </div>`;
  $('#allHist').onclick = () => { view.tab='history'; renderExercise(); };
  const metric = view.metric || (hasWeight ? '1rm' : 'reps');
  document.querySelectorAll('#seg button').forEach(b => {
    b.classList.toggle('on', b.dataset.m===metric);
    b.onclick = () => { view.metric=b.dataset.m; renderStats(ex); };
  });
  const fn = {
    '1rm': s => sessionBest1rm(s), reps: s => s.reps.reduce((a,b)=>a+b,0),
    vol: s => sessionVolume(s), w: s => s.weight
  }[metric];
  drawChart($('#chart'), ss.map(s => ({x:s.date, y:fn(s)})));
}

function historyRows(list, all, withDelete){
  // mark which sessions set a new est. 1RM record at the time
  const prs = new Set(); let run = 0;
  all.forEach(s => { const b = sessionBest1rm(s); if(b > run){ if(run>0) prs.add(s.id); run = b; } });
  return list.map(s => `
    <div class="hist">
      <div style="min-width:0">
        <div class="d">${prettyDate(s.date)} ${prs.has(s.id)?'<span class="pr">PR</span>':''}</div>
        <div class="small muted">${fmt(s.weight)}${db.unit}${s.weight? ' · est. 1RM '+fmt(sessionBest1rm(s)) : ''}</div>
      </div>
      <div class="row" style="gap:6px;margin-left:auto">${s.reps.map(r=>`<span class="chip">${r}</span>`).join('')}</div>
      ${withDelete? `<button class="del" data-del="${s.id}" aria-label="Delete">✕</button>`:''}
    </div>`).join('');
}

function renderHistory(ex){
  const ss = sessionsFor(ex.id);
  $('#pane').innerHTML = ss.length ? `<div class="card">${historyRows(ss.slice().reverse(), ss, true)}</div>
    <button class="ghost" id="delEx" style="width:100%;color:var(--danger)">Delete exercise</button>`
    : `<div class="card empty">No history yet.</div><button class="ghost" id="delEx" style="width:100%;color:var(--danger)">Delete exercise</button>`;
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirmSheet('Delete this workout?', 'Delete', () => {
    db.sessions = db.sessions.filter(s => s.id !== b.dataset.del); save(); renderExercise();
  }));
  $('#delEx').onclick = () => confirmSheet(`Delete ${ex.name} and all its history?`, 'Delete', () => {
    db.exercises = db.exercises.filter(e => e.id!==ex.id);
    db.sessions = db.sessions.filter(s => s.exId!==ex.id);
    db.days.forEach(d => d.exIds = d.exIds.filter(id => id!==ex.id)); save(); back();
  });
}

// ---------- chart (hand-drawn canvas, works offline) ----------
function drawChart(cv, pts){
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const c = cv.getContext('2d'); c.scale(dpr,dpr);
  const css = getComputedStyle(document.documentElement);
  const col = n => css.getPropertyValue(n).trim();
  c.font = '11px -apple-system, sans-serif';
  if(pts.length < 2){
    c.fillStyle = col('--muted'); c.textAlign='center';
    c.fillText('Log 2+ workouts to see a trend', W/2, H/2);
    if(pts.length===1){ c.fillStyle=col('--accent'); c.beginPath(); c.arc(W/2,H/2-24,5,0,7); c.fill(); }
    return;
  }
  const pad = {l:36, r:12, t:12, b:22};
  const ys = pts.map(p=>p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if(lo===hi){ lo -= 1; hi += 1; }
  const span = hi-lo; lo -= span*0.1; hi += span*0.1; if(lo<0 && Math.min(...ys)>=0) lo = Math.max(0, lo);
  const X = i => pad.l + (W-pad.l-pad.r) * (i/(pts.length-1));
  const Y = v => pad.t + (H-pad.t-pad.b) * (1 - (v-lo)/(hi-lo));
  // grid
  c.strokeStyle = col('--line'); c.fillStyle = col('--muted'); c.lineWidth = 1; c.textAlign='right';
  for(let i=0;i<=3;i++){ const v = lo + (hi-lo)*i/3, y = Y(v);
    c.beginPath(); c.moveTo(pad.l,y); c.lineTo(W-pad.r,y); c.stroke();
    c.fillText(Math.round(v), pad.l-6, y+3); }
  // x labels: first & last
  c.textAlign='left'; c.fillText(prettyDate(pts[0].x).replace(/^\w+ /,''), pad.l, H-6);
  c.textAlign='right'; c.fillText(prettyDate(pts[pts.length-1].x).replace(/^\w+ /,''), W-pad.r, H-6);
  // area
  const g = c.createLinearGradient(0,pad.t,0,H-pad.b);
  g.addColorStop(0,'rgba(255,122,61,.35)'); g.addColorStop(1,'rgba(255,122,61,0)');
  c.beginPath(); pts.forEach((p,i)=> i?c.lineTo(X(i),Y(p.y)):c.moveTo(X(i),Y(p.y)));
  c.lineTo(X(pts.length-1),H-pad.b); c.lineTo(X(0),H-pad.b); c.closePath(); c.fillStyle=g; c.fill();
  // line
  c.beginPath(); pts.forEach((p,i)=> i?c.lineTo(X(i),Y(p.y)):c.moveTo(X(i),Y(p.y)));
  c.strokeStyle = col('--accent'); c.lineWidth = 2.5; c.lineJoin='round'; c.stroke();
  // dots
  c.fillStyle = col('--accent');
  if(pts.length <= 40) pts.forEach((p,i)=>{ c.beginPath(); c.arc(X(i),Y(p.y),3.5,0,7); c.fill(); });
}
window.addEventListener('resize', () => { if(view.name==='exercise' && view.tab==='stats') render(); });

// ---------- menu: units + backup ----------
function openMenu(){
  sheet(`<h2>Settings</h2>
    <label>Units</label>
    <div class="tabs"><button data-u="kg" class="${db.unit==='kg'?'on':''}">kg</button><button data-u="lb" class="${db.unit==='lb'?'on':''}">lb</button></div>
    <label>Backup (copy this somewhere safe, paste it back to restore)</label>
    <textarea id="bk">${esc(JSON.stringify(db))}</textarea>
    <div class="row" style="margin-top:10px">
      <button class="ghost" style="flex:1" id="copyBk">Copy backup</button>
      <button class="ghost" style="flex:1" id="restoreBk">Restore from box</button>
    </div>
    <button class="primary" style="margin-top:12px" id="closeM">Done</button>`);
  document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { db.unit=b.dataset.u; save(); openMenu(); render(); });
  $('#copyBk').onclick = async () => {
    try{ await navigator.clipboard.writeText($('#bk').value); toast('Backup copied'); }
    catch(e){ $('#bk').select(); toast('Select all & copy manually', true); }
  };
  $('#restoreBk').onclick = () => {
    try{ const d = JSON.parse($('#bk').value);
      if(!Array.isArray(d.exercises) || !Array.isArray(d.sessions)) throw 0;
      confirmSheet('Replace all data with this backup?', 'Restore', () => { db = d; if(!Array.isArray(db.days)) db.days=[]; save(); goHome(); toast('Restored'); });
    }catch(e){ toast('That backup text is not valid', true); }
  };
  $('#closeM').onclick = closeSheet;
}

// ---------- offline support ----------
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
render();
</script>
